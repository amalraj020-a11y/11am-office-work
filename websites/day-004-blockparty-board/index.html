<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>BlockParty Board</title><link rel="stylesheet" href="styles.css"><script defer src="app.js"></script></head><body><header><h1>BlockParty Board</h1><p class="tagline">Your neighborhood’s bulletin board, zero‑setup.</p></header><main><section id="create-section"><h2>Create Event</h2><form id="event-form" novalidate><div class="form-group"><label for="title">Title<span aria-hidden="true">*</span></label><input type="text" id="title" name="title" required minlength="3"></div><div class="form-group"><label for="date">Date<span aria-hidden="true">*</span></label><input type="date" id="date" name="date" required></div><div class="form-group"><label for="time">Time<span aria-hidden="true">*</span></label><input type="time" id="time" name="time" required></div><div class="form-group"><label for="location">Location<span aria-hidden="true">*</span></label><input type="text" id="location" name="location" required></div><div class="form-group"><label for="limit">Attendee Limit (optional)</label><input type="number" id="limit" name="limit" min="1"></div><div class="form-group"><label for="description">Description</label><textarea id="description" name="description" rows="3"></textarea></div><button type="submit">Create Event</button></form></section><section id="event-view" class="hidden"><h2 id="event-title"></h2><p id="event-datetime"></p><p id="event-location"></p><p id="event-description"></p><div id="rsvp-section"><h3>RSVP</h3><form id="rsvp-form" novalidate><div class="form-group"><label for="rsvp-name">Your Name<span aria-hidden="true">*</span></label><input type="text" id="rsvp-name" name="rsvp-name" required minlength="2"></div><div class="form-group"><label for="rsvp-note">Note (optional)</label><input type="text" id="rsvp-note" name="rsvp-note"></div><button type="submit">Join</button></form></div><div id="attendees"><h3>Attendees (<span id="attendee-count">0</span>)</h3><ul id="attendee-list"></ul></div></section></main><footer><p>© 2026 BlockParty Board – Open source, no tracking.</p></footer></body></html>
