<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Community Kitchen Planner</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header>
<h1>Community Kitchen Planner</h1>
</header>
<main>
<section id="calendar" aria-label="Weekly kitchen schedule"></section>
<button id="exportBtn" class="action-btn">Export Data</button>
<input type="file" id="importInput" accept="application/json" hidden>
<label for="importInput" class="action-btn">Import Data</label>
</main>
<div id="modal" class="modal" aria-hidden="true">
<div class="modal-content" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
<h2 id="modalTitle">Book a Slot</h2>
<form id="slotForm">
<label for="dishInput">Dish / Activity</label>
<input type="text" id="dishInput" name="dish" required minlength="2">
<label for="noteInput">Notes (optional)</label>
<textarea id="noteInput" name="note" rows="3"></textarea>
<button type="submit" class="action-btn">Save</button>
<button type="button" id="closeModal" class="action-btn secondary">Cancel</button>
</form>
</div>
</div>
<script src="app.js"></script>
</body>
</html>
