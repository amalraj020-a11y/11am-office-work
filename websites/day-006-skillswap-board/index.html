<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SkillSwap Board</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header>
<h1>SkillSwap Board</h1>
<p class="tagline">Learn locally, share freely.</p>
</header>
<main>
<section class="controls">
<button id="addBtn" aria-label="Add new listing">Add Listing</button>
<input type="text" id="searchInput" placeholder="Search by keyword..." aria-label="Search listings">
<select id="categoryFilter" aria-label="Filter by category">
<option value="">All Categories</option>
<option value="Music">Music</option>
<option value="Language">Language</option>
<option value="Tech">Tech</option>
<option value="Crafts">Crafts</option>
<option value="Fitness">Fitness</option>
</select>
</section>
<section id="listings" class="listings"></section>
</main>
<!-- Modal -->
<div id="modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
<div class="modal-content">
<h2 id="modalTitle">Add Skill Listing</h2>
<form id="listingForm">
<label for="typeSelect">I want to</label>
<select id="typeSelect" name="type" required>
<option value="Offer">Offer</option>
<option value="Request">Request</option>
</select>

<label for="titleInput">Title</label>
<input type="text" id="titleInput" name="title" required maxlength="50">

<label for="categorySelect">Category</label>
<select id="categorySelect" name="category" required>
<option value="Music">Music</option>
<option value="Language">Language</option>
<option value="Tech">Tech</option>
<option value="Crafts">Crafts</option>
<option value="Fitness">Fitness</option>
</select>

<label for="descInput">Description</label>
<textarea id="descInput" name="description" rows="3" maxlength="200" required></textarea>

<label for="priceInput">Price (optional, $)</label>
<input type="number" id="priceInput" name="price" min="0" step="0.01" placeholder="0.00">

<label for="dateInput">Proposed date</label>
<input type="date" id="dateInput" name="date">

<button type="submit">Save</button>
<button type="button" id="cancelBtn">Cancel</button>
</form>
</div>
</div>
<script src="app.js"></script>
</body>
</html>
