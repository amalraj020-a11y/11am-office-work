<!DOCTYPE html>\n<html lang=\"en\">\n<head><meta name="viewport" content="width=device-width, initial-scale=1">\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>Neighbourhood Repair Board</title>\n<link rel=\"stylesheet\" href=\"styles.css\">\n</head>\n<body>\n<header>\n  <h1>Neighbourhood Repair Board</h1>\n</header>\n<main>\n  <section id=\"post-section\">\n    <h2>Post a Repair Request</h2>\n    <form id=\"request-form\">\n      <label for=\"title\">Title</label>\n      <input type=\"text\" id=\"title\" required minlength=\"3\"/>\n      <label for=\"description\">Description</label>\n      <textarea id=\"description\" rows=\"3\" required></textarea>\n      <label for=\"skill\">Needed Skill</label>\n      <select id=\"skill\" required>\n        <option value=\"\">Select skill</option>\n        <option>Plumbing</option>\n        <option>Electrical</option>\n        <option>Carpentry</option>\n        <option>Painting</option>\n        <option>General Handyman</option>\n      </select>\n      <button type=\"submit\">Add Request</button>\n    </form>\n  </section>\n  <section id=\"filter-section\">\n    <h2>Filter Requests</h2>\n    <label for=\"filter-skill\">Skill</label>\n    <select id=\"filter-skill\">\n      <option value=\"all\">All</option>\n      <option>Plumbing</option>\n      <option>Electrical</option>\n      <option>Carpentry</option>\n      <option>Painting</option>\n      <option>General Handyman</option>\n    </select>\n  </section>\n  <section id=\"list-section\">\n    <h2>Current Requests</h2>\n    <ul id=\"request-list\"></ul>\n    <p id=\"empty-state\">No requests posted yet.</p>\n  </section>\n</main>\n<script src=\"app.js\"></script>\n</body>\n</html>
