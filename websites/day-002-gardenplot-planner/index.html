<!DOCTYPE html>\n<html lang=\"en\">\n<head><meta name="viewport" content="width=device-width, initial-scale=1">\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>GardenPlot Planner</title>\n<link rel=\"stylesheet\" href=\"styles.css\">\n</head>\n<body>\n<header>\n  <h1>GardenPlot Planner</h1>\n  <p>Manage community garden plots easily.</p>\n</header>\n<main>\n  <section id=\"calendar\">\n    <h2>Plot Calendar</h2>\n    <div id=\"plotContainer\" class=\"grid\"></div>\n  </section>\n  <section id=\"formSection\">\n    <h2>Claim a Plot</h2>\n    <form id=\"claimForm\">\n      <label for=\"plotNumber\">Plot Number (1‑20):</label>\n      <input type=\"number\" id=\"plotNumber\" name=\"plotNumber\" min=\"1\" max=\"20\" required>\n      <label for=\"ownerName\">Your Name:</label>\n      <input type=\"text\" id=\"ownerName\" name=\"ownerName\" required>\n      <label for=\"plant\">Planting Notes:</label>\n      <textarea id=\"plant\" name=\"plant\" rows=\"3\"></textarea>\n      <label for=\"harvestDate\">Expected Harvest (YYYY‑MM‑DD):</label>\n      <input type=\"date\" id=\"harvestDate\" name=\"harvestDate\">\n      <button type=\"submit\">Claim Plot</button>\n    </form>\n  </section>\n</main>\n<footer>\n  <p>© 2026 GardenPlot Planner – Open Source</p>\n</footer>\n<script src=\"app.js\"></script>\n</body>\n</html>
