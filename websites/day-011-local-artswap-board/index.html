<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Local ArtSwap Board</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header>
<h1>Local ArtSwap Board</h1>
<p>Swap art, crafts, and supplies with neighbors.</p>
</header>
<main>
<section id="new-listing">
<h2>Create a Listing</h2>
<form id="listing-form" novalidate>
<div class="form-group">
<label for="title">Title</label>
<input type="text" id="title" required minlength="3" />
</div>
<div class="form-group">
<label for="description">Description</label>
<textarea id="description" rows="3" required minlength="10"></textarea>
</div>
<div class="form-group">
<label for="category">Category</label>
<select id="category" required>
<option value="">Select</option>
<option>Painting</option>
<option>Sketch</option>
<option>Craft</option>
<option>Supplies</option>
<option>Other</option>
</select>
</div>
<div class="form-group">
<label for="imageUrl">Image URL (optional)</label>
<input type="url" id="imageUrl" placeholder="https://example.com/image.jpg" />
</div>
<div class="form-group">
<label for="zip">Your Zip (first 3 digits)</label>
<input type="text" id="zip" pattern="\d{3}" placeholder="123" required />
</div>
<button type="submit">Add Listing</button>
</form>
</section>
<section id="filters">
<h2>Browse Listings</h2>
<div class="form-group">
<label for="filter-category">Category</label>
<select id="filter-category">
<option value="">All</option>
<option>Painting</option>
<option>Sketch</option>
<option>Craft</option>
<option>Supplies</option>
<option>Other</option>
</select>
</div>
<div class="form-group">
<label for="filter-zip">Zip prefix (first 3 digits)</label>
<input type="text" id="filter-zip" pattern="\d{3}" placeholder="123" />
</div>
</section>
<section id="listings">
<h2>Available Swaps</h2>
<ul id="listing-list"></ul>
</section>
</main>
<footer>
<p>&copy; 2026 Local ArtSwap Board – Open source</p>
</footer>
<script src="app.js"></script>
</body>
</html>
