<!DOCTYPE html>\n<html lang=\"en\">\n<head><meta name="viewport" content="width=device-width, initial-scale=1">\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>ToolShare Scheduler</title>\n<link rel=\"stylesheet\" href=\"styles.css\">\n</head>\n<body>\n  <header>\n    <h1>ToolShare Scheduler</h1>\n    <button id=\"exportBtn\">Export JSON</button>\n    <input type=\"file\" id=\"importInput\" accept=\"application/json\" style=\"display:none\">\n    <button id=\"importBtn\">Import JSON</button>\n  </header>\n  <main>\n    <section id=\"toolFormSection\">\n      <h2>Add / Edit Tool</h2>\n      <form id=\"toolForm\">\n        <label for=\"toolName\">Name</label>\n        <input type=\"text\" id=\"toolName\" required>\n        <label for=\"toolQty\">Quantity</label>\n        <input type=\"number\" id=\"toolQty\" min=\"1\" value=\"1\" required>\n        <button type=\"submit\">Save Tool</button>\n      </form>\n    </section>\n    <section id=\"toolListSection\">\n      <h2>Tools</h2>\n      <ul id=\"toolList\"></ul>\n    </section>\n  </main>\n<script src=\"app.js\"></script>\n</body>\n</html>
