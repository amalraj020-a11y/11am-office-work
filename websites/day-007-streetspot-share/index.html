<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StreetSpot Share</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header>
<h1>StreetSpot Share</h1>
<p class="tagline">Find a Spot, Share a Spot – Simple Parking for Neighbours</p>
</header>
<main>
<section class="listing-form">
<h2>Create Listing</h2>
<form id="listingForm" novalidate>
<div class="form-group">
<label for="address">Address</label>
<input type="text" id="address" required>
</div>
<div class="form-group">
<label for="zip">ZIP Code</label>
<input type="text" id="zip" pattern="\d{5}" required placeholder="e.g., 12345">
</div>
<div class="form-group">
<label for="dateFrom">From</label>
<input type="date" id="dateFrom" required>
</div>
<div class="form-group">
<label for="dateTo">To</label>
<input type="date" id="dateTo" required>
</div>
<div class="form-group">
<label for="price">Price (₹)</label>
<input type="number" id="price" min="0" step="0.01" required>
</div>
<div class="form-group">
<label for="photoUrl">Photo URL (optional)</label>
<input type="url" id="photoUrl" placeholder="https://...">
</div>
<button type="submit">Add Listing</button>
</form>
</section>
<section class="search-section">
<h2>Search Listings</h2>
<form id="searchForm" novalidate>
<div class="form-group">
<label for="searchZip">ZIP Code</label>
<input type="text" id="searchZip" pattern="\d{5}" required placeholder="e.g., 12345">
</div>
<div class="form-group">
<label for="searchDate">Date</label>
<input type="date" id="searchDate" required>
</div>
<button type="submit">Search</button>
</form>
<div id="results" class="results"></div>
</section>
</main>
<footer>
<p>© 2026 StreetSpot Share – Open source demo</p>
</footer>
<script src="app.js"></script>
</body>
</html>
