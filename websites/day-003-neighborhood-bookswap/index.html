<!DOCTYPE html>\n<html lang=\"en\">\n<head><meta name="viewport" content="width=device-width, initial-scale=1">\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>Neighborhood BookSwap</title>\n<link rel=\"stylesheet\" href=\"styles.css\">\n</head>\n<body>\n<header>\n  <h1>Neighborhood BookSwap</h1>\n  <p>Share books with neighbors – simple, offline‑first.</p>\n</header>\n<main>\n  <section id=\"add-section\">\n    <h2>Add a Book</h2>\n    <form id=\"add-form\">\n      <label for=\"title\">Title</label>\n      <input type=\"text\" id=\"title\" required>\n      <label for=\"author\">Author</label>\n      <input type=\"text\" id=\"author\" required>\n      <label for=\"condition\">Condition</label>\n      <select id=\"condition\">\n        <option>New</option>\n        <option>Like New</option>\n        <option>Good</option>\n        <option>Fair</option>\n      </select>\n      <label for=\"notes\">Notes (optional)</label>\n      <textarea id=\"notes\"></textarea>\n      <button type=\"submit\">Add Book</button>\n    </form>\n  </section>\n  <section id=\"search-section\">\n    <h2>Find a Book</h2>\n    <input type=\"search\" id=\"search-input\" placeholder=\"Search by title or author\">\n    <div id=\"books-list\" class=\"grid\"></div>\n  </section>\n</main>\n<footer>\n  <button id=\"export-btn\">Export Data</button>\n  <input type=\"file\" id=\"import-input\" accept=\"application/json\" style=\"display:none\">\n  <button id=\"import-btn\">Import Data</button>\n</footer>\n<script src=\"app.js\"></script>\n</body>\n</html>
