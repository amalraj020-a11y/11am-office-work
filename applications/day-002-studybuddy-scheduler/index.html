<!DOCTYPE html>\n<html lang=\"en\">\n<head><meta name="viewport" content="width=device-width, initial-scale=1">\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>StudyBuddy Scheduler</title>\n<link rel=\"stylesheet\" href=\"styles.css\">\n</head>\n<body>\n  <header>\n    <h1>StudyBuddy Scheduler</h1>\n    <p class=\"tagline\">Find a study buddy in seconds – no group chat required.</p>\n  </header>\n  <main>\n    <section class=\"controls\">\n      <button id=\"addBtn\">Add Session</button>\n      <div class=\"filters\">\n        <select id=\"subjectFilter\">\n          <option value=\"\">All Subjects</option>\n          <option value=\"Math\">Math</option>\n          <option value=\"Science\">Science</option>\n          <option value=\"History\">History</option>\n          <option value=\"Language\">Language</option>\n        </select>\n        <input type=\"date\" id=\"dateFilter\">\n        <input type=\"text\" id=\"locationFilter\" placeholder=\"Location\">\n      </div>\n    </section>\n    <section id=\"sessionList\" class=\"list\"></section>\n    <section id=\"mySessions\" class=\"list\"><h2>My Sessions</h2></section>\n  </main>\n  <dialog id=\"sessionDialog\">\n    <form id=\"sessionForm\">\n      <h2 id=\"dialogTitle\"></h2>\n      <label>Type\n        <select name=\"type\" required>\n          <option value=\"offer\">Offer</option>\n          <option value=\"request\">Request</option>\n        </select>\n      </label>\n      <label>Subject\n        <input type=\"text\" name=\"subject\" required placeholder=\"e.g. Math\">\n      </label>\n      <label>Date\n        <input type=\"date\" name=\"date\" required>\n      </label>\n      <label>Time\n        <input type=\"time\" name=\"time\" required>\n      </label>\n      <label>Location\n        <input type=\"text\" name=\"location\" required placeholder=\"Library, Room 101\">\n      </label>\n      <label>Notes (optional)\n        <textarea name=\"notes\"></textarea>\n      </label>\n      <div class=\"dialog-actions\">\n        <button type=\"submit\">Save</button>\n        <button type=\"button\" id=\"cancelBtn\">Cancel</button>\n      </div>\n    </form>\n  </dialog>\n<script src=\"app.js\"></script>\n</body>\n</html>
