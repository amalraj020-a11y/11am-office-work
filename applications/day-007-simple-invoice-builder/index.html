<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simple Invoice Builder</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header>
<h1>Simple Invoice Builder</h1>
</header>
<main>
<section id="form-section">
<h2>Create Invoice</h2>
<form id="invoice-form" novalidate>
<div class="field-group">
<label for="client-name">Client Name *</label>
<input type="text" id="client-name" name="clientName" required>
<span class="error" aria-live="polite"></span>
</div>
<div class="field-group">
<label for="client-email">Client Email *</label>
<input type="email" id="client-email" name="clientEmail" required>
<span class="error" aria-live="polite"></span>
</div>
<div class="field-group">
<label for="invoice-date">Invoice Date *</label>
<input type="date" id="invoice-date" name="invoiceDate" required>
<span class="error" aria-live="polite"></span>
</div>
<h3>Line Items</h3>
<div id="items-container"></div>
<button type="button" id="add-item-btn">Add Item</button>
<div class="field-group">
<label for="tax-rate">Tax Rate (%)</label>
<input type="number" id="tax-rate" name="taxRate" min="0" step="0.01" value="0">
</div>
<button type="submit">Preview Invoice</button>
</form>
</section>
<section id="preview-section" class="hidden">
<h2>Invoice Preview</h2>
<div id="invoice-preview" class="invoice-box"></div>
<button id="edit-btn">Edit</button>
<button id="print-btn">Print / Save</button>
</section>
<section id="saved-section">
<h2>Saved Invoices</h2>
<ul id="saved-list"></ul>
</section>
</main>
<script src="app.js"></script>
</body>
</html>
