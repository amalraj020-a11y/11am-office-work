<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FamilyMeal Planner</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header>
<h1>FamilyMeal Planner</h1>
</header>
<main>
<section id="planner">
<h2>Weekly Planner</h2>
<div class="grid" id="meal-grid">
<!-- 7 days x 3 meals (breakfast, lunch, dinner) -->
</div>
<button id="add-meal-btn">Add Meal</button>
</section>
<section id="grocery" class="hidden">
<h2>Grocery List</h2>
<ul id="grocery-list"></ul>
<button id="export-pdf-btn" class="hidden">Export PDF (Premium)</button>
</section>
</main>
<footer>
<p>© 2026 FamilyMeal Planner – offline‑first, no login.</p>
</footer>
<script src="app.js"></script>
</body>
</html>
