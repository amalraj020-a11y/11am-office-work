<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>GigTime Tracker</title><link rel="stylesheet" href="styles.css"><script defer src="app.js"></script></head><body><header><h1>GigTime Tracker</h1></header><main><section id="client-section"><h2>Clients</h2><form id="client-form" aria-label="Add client"><input type="text" id="client-name" placeholder="Client name" required aria-required="true"><input type="number" id="client-rate" placeholder="Hourly rate ($)" min="0" step="0.01" required aria-required="true"><button type="submit">Add Client</button></form><ul id="client-list" aria-live="polite"></ul></section><section id="job-section"><h2>Jobs</h2><form id="job-form" aria-label="Add job"><select id="job-client" required aria-required="true"></select><input type="text" id="job-name" placeholder="Job description" required aria-required="true"><button type="submit">Add Job</button></form><ul id="job-list" aria-live="polite"></ul></section><section id="summary-section"><h2>Summary</h2><button id="export-csv">Export CSV</button><pre id="summary" aria-label="Earnings summary"></pre></section></main><footer><p>© 2026 GigTime Tracker – free and open source</p></footer></body></html>
